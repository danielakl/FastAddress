services:
  fastaddress.db:
    container_name: database
    image: postgis/postgis:18-3.6-alpine
    restart: always
    environment:
      - POSTGRES_DB=fastaddress
      - POSTGRES_USER=fastadm
      - POSTGRES_PASSWORD=KCq9vgmr6rP2TyTc8ZXrJfin6vKC8U
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d $${POSTGRES_DB}", "-U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    
  fastaddress.log:
    container_name: log
    image: datalust/seq:2025.2
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "8080:80"
      - "5341:5341"
